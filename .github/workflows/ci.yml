name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read # checkout do codigo do repositorio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Lint
        run: make lint

      - name: Unit & Integration Tests (Parallel)
        run: pytest -n auto --dist worksteal -m "unit or integration" --ignore=tests/test_gui_dynamic_form.py

      - name: Install system dependencies (Qt)
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::Retries=3 install -y --no-install-recommends libegl1 libxkbcommon-x11-0

      - name: E2E Tests (CLI, TUI, GUI & Full Pipeline)
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test-e2e
