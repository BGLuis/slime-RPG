[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: testes unitarios rapidos e isolados (sem I/O pesado, subprocessos ou GUI)
    integration: testes de integracao com SQLite, adapters binarios, corpus e pipeline
    e2e: testes ponta-a-ponta de CLI (subprocess), TUI (Textual), GUI (PyQt5) e fluxos completos de job
    live: testes que exigem conexao de rede real ou servidor Ollama ativo
